name: Update blog posts

# Refreshes the "Recent writing" list in README.md from the blog's Atom feed.
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # 1.9.7
        with:
          feed_list: "https://vuminhhoa.com/en/feed.xml"
          max_post_count: 6
          template: "$newline- [$title]($url)"
          commit_message: "Update recent writing from the blog"
          committer_username: "github-actions[bot]"
          committer_email: "41898282+github-actions[bot]@users.noreply.github.com"
