name: Update blog posts

# Refreshes the "Recent writing" list in README.md from the blog's Atom feed.
# The portfolio repo dispatches `blog-updated` after each production deploy;
# the daily run is a fallback.
on:
  repository_dispatch:
    types: [blog-updated]
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: blog-posts

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    # Only this job may push the README update.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # blog-post-workflow sets its own authenticated remote before pushing.
          persist-credentials: false
      - uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # 1.9.7
        with:
          feed_list: "https://vuminhhoa.com/en/feed.xml"
          max_post_count: 6
          template: "$newline- [$title]($url)"
          commit_message: "Update recent writing from the blog"
          committer_username: "github-actions[bot]"
          committer_email: "41898282+github-actions[bot]@users.noreply.github.com"
